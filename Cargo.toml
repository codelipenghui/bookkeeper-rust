[workspace]
resolver = "2"
members = [
    "crates/bookkeeper-proto",
    "crates/bookkeeper-common",
    "crates/bookkeeper-protocol",
    "crates/bookkeeper-metadata",
    "crates/bookkeeper-storage",
    "crates/bookkeeper-server",
    "crates/bookkeeper-client",
    "crates/bookkeeper-config",
    "crates/bookkeeper-cli",
    "crates/bookkeeper-replication",
    "crates/bookkeeper-test-utils",
    "crates/bookkeeper-upgrade-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
bookkeeper-proto = { path = "crates/bookkeeper-proto" }
bookkeeper-common = { path = "crates/bookkeeper-common" }
bookkeeper-protocol = { path = "crates/bookkeeper-protocol" }
bookkeeper-metadata = { path = "crates/bookkeeper-metadata" }
bookkeeper-storage = { path = "crates/bookkeeper-storage" }
bookkeeper-server = { path = "crates/bookkeeper-server" }
bookkeeper-client = { path = "crates/bookkeeper-client" }
bookkeeper-config = { path = "crates/bookkeeper-config" }
bookkeeper-cli = { path = "crates/bookkeeper-cli" }
bookkeeper-replication = { path = "crates/bookkeeper-replication" }
bookkeeper-test-utils = { path = "crates/bookkeeper-test-utils" }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rand = "0.10"
rocksdb = "0.24"
parking_lot = "0.12"
dashmap = "6"
crossbeam-channel = "0.5"
async-trait = "0.1"

bytes = "1"
prost = "0.14"
prost-build = "0.14"
thiserror = "2"
crc32fast = "1"
crc32c = "0.6"
hmac = "0.13"
sha1 = "0.11"
# Tokio feature set is narrowed from `full` to only what's actually used
# across the workspace (verified by grep). Dropping `fs`, `process`, and
# `io-std` meaningfully shortens cold build time.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "parking_lot",
] }
tokio-util = { version = "0.7", features = ["codec"] }
zookeeper-client = { version = "0.11", features = ["tokio"] }
# liboxia 0.0.2 has a critical bug in its session keep-alive loop:
# `tokio::select! { _ = cancelled() => ..., else => keep_alive() }`
# never fires the `else` branch while `cancelled()` is pending, so
# heartbeats are never sent and sessions die at `session_timeout`.
# Upstream main fixes this with a proper `tokio::time::interval` ticker.
# Pin to the fixed commit until a new crates.io release includes it.
liboxia = { git = "https://github.com/oxia-db/liboxia", rev = "5987d6ea8eea5c9c273164875549fa3e587d4089", default-features = false }
testcontainers-oxia = "0.0.1"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
prometheus = "0.14"
lazy_static = "1"
hdrhistogram = "7"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
io-uring = "0.7"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
pprof = { version = "0.15", features = ["flamegraph"] }

# Test / benchmark tools — shared across multiple crates.
criterion = "0.8"
testcontainers = "0.27"
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rcgen = "0.14"

# Production release profile: optimize for the smallest binary.
# Stripped of debug info and symbols. Use this for the `runtime` Docker
# image and any deployment that doesn't need profiling.
[profile.release]
strip = "symbols"
debug = false
lto = "thin"

# Debug-friendly release profile: same optimization level as `release`,
# but keeps `line-tables-only` DWARF so that pprof flamegraphs have
# meaningful function names. Use this for the `debug-runtime` Docker
# image and the `--features profiling` build.
[profile.release-debug]
inherits = "release"
strip = "none"
debug = "line-tables-only"
