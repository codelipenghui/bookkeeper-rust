# Rust BookKeeper bookie config for the oxia docker-compose playground.
#
# Identical to `bk_server.conf` except the metadata backend is Apache
# Oxia instead of ZooKeeper. All other tuning — journal paths, storage
# dirs, disk monitor, HTTP admin — is shared, so operators can A/B the
# two backends without re-learning the config surface.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

bookiePort=3181
listeningInterface=0.0.0.0

# NOTE: `advertisedAddress` is NOT set here. The compose stack overrides
# it per-bookie via `bk serve --advertised-address rust-bookie-N` so a
# single shared config file can back multiple bookie instances.
#advertisedAddress=rust-bookie

# ---------------------------------------------------------------------------
# Metadata store (Oxia)
#
# URI shape:
#   oxia://<host>:<port>/<namespace>[/<ledgers-root>]
#
# Accepts an optional `metadata-store:` prefix for Pulsar-config parity:
#   metadataServiceUri=metadata-store:oxia://oxia:6648/default/ledgers
#
# The on-wire keys are bit-compatible with Pulsar's
# pulsar-metadata/bookkeeper driver — a Pulsar broker configured with the
# same oxia namespace + ledgers-root will see the bookies these services
# produce as first-class peers.
# ---------------------------------------------------------------------------

metadataServiceUri=oxia://oxia:6648/default/ledgers

# ---------------------------------------------------------------------------
# Storage paths (persistent volumes in docker-compose)
# ---------------------------------------------------------------------------

journalDirectory=/bk/journal
ledgerDirectories=/bk/data

# ---------------------------------------------------------------------------
# Disk monitor — disabled for the playground (see bk_server.conf for why)
# ---------------------------------------------------------------------------

readOnlyModeEnabled=false

# ---------------------------------------------------------------------------
# HTTP admin API (used by docker-compose healthchecks)
# ---------------------------------------------------------------------------

httpServerEnabled=true
httpServerPort=8080
