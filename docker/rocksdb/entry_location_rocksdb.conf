# Default rocksdb options for the entry-location index.
#
# Byte-for-byte match of Apache BookKeeper's shipped
# `conf/entry_location_rocksdb.conf` so operators who already know Java BK's
# tuning surface can reuse it verbatim. Parsed by
# `bookkeeper_storage::rocksdb_options::load()`; unknown keys are logged and
# skipped rather than erroring.
#
# The same defaults are also embedded in the Rust binary as
# `DEFAULT_ENTRY_LOCATION_CONF` — if `entryLocationRocksdbConf` is NOT set
# in bk_server.conf the bookie falls back to the embedded copy, so this
# file exists primarily so operators can override individual values.

[DBOptions]
create_if_missing=true
info_log_level=INFO_LEVEL
keep_log_file_num=30
log_file_time_to_roll=86400
max_background_jobs=4
max_subcompactions=1
max_total_wal_size=536870912
max_open_files=-1
delete_obsolete_files_period_micros=3600000000

[CFOptions "default"]
# Entry-location rows are tiny (16-byte key = ledgerId|entryId, 8-byte value
# = file offset). LZ4 here burned ~5% of total bookie CPU in flamegraphs
# and produced near-zero compression ratio on random-ID keys. Disable.
compression=kNoCompression
# Larger memtable → fewer L0 files produced per unit of write load →
# fewer L0→L1 compaction triggers. Was 64 MiB.
write_buffer_size=268435456
# More flush slots so add_entry doesn't stall when one memtable is mid-flush.
max_write_buffer_number=6
num_levels=7
# Batch more L0 files before triggering compaction. Was 4.
level0_file_num_compaction_trigger=8
# Keep the pyramid ratio close to RocksDB's default (10x target_file_size).
# Was 256 MiB.
max_bytes_for_level_base=1073741824
# Larger SSTs → fewer files, lower compaction fan-out. Was 64 MiB.
target_file_size_base=268435456
level_compaction_dynamic_level_bytes=true

[TableOptions/BlockBasedTable "default"]
block_size=65536
block_cache=536870912
format_version=5
checksum=kxxHash
filter_policy=rocksdb.BloomFilter:10:false
# Pinning index+filter blocks permanently in the per-SST TableReader
# handle. Prevents the block cache from thrashing bloom/filter blocks
# against data blocks under read-heavy catch-up workloads (which we
# observed burning ~93% CPU in `VerifyBlockChecksum` → `XXH32_round`
# when set to `true`). The per-SST memory cost is small (~10 bits/key
# for the filter, plus ~1% of data for index), and worth trading for
# stable read latency. See Java BK default comment "Options best suited
# for HDDs" — that trade-off no longer holds for SSD + read-heavy.
cache_index_and_filter_blocks=false
