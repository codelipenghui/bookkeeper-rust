# Default rocksdb options for the ledger-metadata index.
#
# Byte-for-byte match of Apache BookKeeper's shipped
# `conf/ledger_metadata_rocksdb.conf`. The ledger metadata index is tiny
# (one entry per open ledger) so Java leaves almost everything at rocksdb
# defaults — no compression, no bloom filter, no extra block cache.
#
# Parsed by `bookkeeper_storage::rocksdb_options::load()` — same semantics
# as the entry location file. An embedded copy
# (`DEFAULT_LEDGER_METADATA_CONF`) is used when `ledgerMetadataRocksdbConf`
# is not set in bk_server.conf.

[DBOptions]
create_if_missing=true
info_log_level=INFO_LEVEL
keep_log_file_num=30
log_file_time_to_roll=86400

[CFOptions "default"]

[TableOptions/BlockBasedTable "default"]
format_version=5
checksum=kxxHash
