# Rust BookKeeper bookie config for the docker-compose playground.
#
# Matches Java's bk_server.conf property names so operators familiar with
# Apache BookKeeper can read/tweak it without learning a new format.

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

bookiePort=3181

# Bind to all interfaces inside the container so peers on the compose
# network can reach us.
listeningInterface=0.0.0.0

# NOTE: `advertisedAddress` is NOT set here. The docker-compose stack
# overrides it per-bookie via `bk serve --advertised-address rust-bookie-N`
# so a single shared config file can back multiple bookie instances.
# Real single-bookie deployments should uncomment and set this.
#advertisedAddress=rust-bookie

# ---------------------------------------------------------------------------
# Metadata store (ZooKeeper)
# ---------------------------------------------------------------------------

zkServers=zookeeper:2181
zkLedgersRootPath=/ledgers

# ---------------------------------------------------------------------------
# Storage paths (persistent volumes in docker-compose)
# ---------------------------------------------------------------------------

journalDirectory=/bk/journal
ledgerDirectories=/bk/data

# ---------------------------------------------------------------------------
# Disk monitor
# ---------------------------------------------------------------------------

# Disable disk-based read-only mode for the playground. The default 95%
# threshold trips instantly on dev laptops with heavily-used root volumes,
# leaving the bookie stuck in ReadOnly at startup. Real deployments
# should re-enable and tune this.
readOnlyModeEnabled=false

# ---------------------------------------------------------------------------
# HTTP admin API (used by docker-compose healthchecks)
# ---------------------------------------------------------------------------

httpServerEnabled=true
httpServerPort=8080

# ---------------------------------------------------------------------------
# Auto-recovery (single-bookie → auditor elects itself)
# ---------------------------------------------------------------------------

autoRecoveryDaemonEnabled=true

# When a bookie goes down, wait this many seconds before marking its
# ledgers as under-replicated. A bookie restart (e.g. after a ZK session
# blip) normally completes in <30s, and re-replicating those ledgers
# would be wasted work. 300s (5 min) matches Java BK's recommended
# production value.
lostBookieRecoveryDelay=300

# ---------------------------------------------------------------------------
# Journal
# ---------------------------------------------------------------------------

journalWriteData=true
journalSyncData=false

# ---------------------------------------------------------------------------
# RocksDB tuning (separate files, matching Java BK's new-style layout)
# ---------------------------------------------------------------------------
#
# Both files are optional — if either key is unset the bookie falls back
# to the built-in defaults (byte-matching Apache BK's shipped files). Set
# them here when you want to override specific keys on-disk without a
# binary rebuild.

entryLocationRocksdbConf=/etc/bookkeeper/rocksdb/entry_location_rocksdb.conf
ledgerMetadataRocksdbConf=/etc/bookkeeper/rocksdb/ledger_metadata_rocksdb.conf

# ---------------------------------------------------------------------------
# Read cache / readahead
# ---------------------------------------------------------------------------
#
# BENCHMARK: both readahead AND primary-read caching disabled to measure
# a pagecache-only read path. `=0` on batch size skips the prefetch walker;
# `=0` on max size turns `put_read` into a no-op so cache-miss reads don't
# update the user-space cache. Sequential reads rely entirely on the kernel
# page cache. Restore defaults for production workloads.
dbStorage_readAheadCacheBatchSize=0
dbStorage_readAheadCacheMaxSizeMb=0

# ---------------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------------

serverNumIOThreads=2
