[package]
name = "bookkeeper-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Enables CPU profiling support: pulls in the `pprof` crate and exposes
# the `/debug/pprof/flamegraph` HTTP admin endpoint. Off by default so the
# production binary doesn't even compile pprof.
profiling = ["dep:pprof"]

[dependencies]
bookkeeper-proto = { workspace = true }
bookkeeper-common = { workspace = true }
bookkeeper-protocol = { workspace = true }
bookkeeper-storage = { workspace = true }
bookkeeper-metadata = { workspace = true }
bookkeeper-config = { workspace = true }
bookkeeper-replication = { workspace = true }
bookkeeper-client = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zookeeper-client = { workspace = true }
prometheus = { workspace = true }
lazy_static = { workspace = true }
tokio-rustls = { workspace = true }
socket2 = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
pprof = { workspace = true, optional = true }
rand = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
bookkeeper-config = { workspace = true }
bookkeeper-test-utils = { workspace = true }
rcgen = { workspace = true }
testcontainers = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }
