[package]
name = "bookkeeper-proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
# prost is used by the generated code (`::prost::Message` derives) emitted
# from build.rs, not from anything in src/ — cargo-machete can't see that.
ignored = ["prost"]

[dependencies]
prost = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
