[package]
name = "bookkeeper-upgrade-test"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[test]]
name = "upgrade"
path = "tests/upgrade.rs"

[dependencies]
# none — this is a test-only crate

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
