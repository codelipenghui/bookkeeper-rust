# Test suite for the Rust BookKeeper bookie.
#
# Builds the workspace inside Linux (Debian Bookworm) and runs tests with
# the io_uring engine. The image is built once and tagged `rustbk-test`;
# all services share it.
#
# First run (or after code changes):
#   docker compose -f docker-compose-test.yml build
#
# Then run any service:
#   docker compose -f docker-compose-test.yml run --rm test-uring-only   # fast (~10s)
#   docker compose -f docker-compose-test.yml run --rm test-all          # full suite
#   docker compose -f docker-compose-test.yml run --rm test-std          # StdEngine baseline
#   docker compose -f docker-compose-test.yml run --rm bench-uring       # bench with io_uring
#   docker compose -f docker-compose-test.yml run --rm bench-std         # bench with StdEngine
#   docker compose -f docker-compose-test.yml down                       # cleanup ZK

x-test-base: &test-base
  build:
    context: .
    dockerfile: Dockerfile
    target: test
  image: rustbk-test
  restart: "no"

services:
  # ZK for integration tests that need a real metadata store
  zookeeper:
    image: zookeeper:3.8
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "*"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Full workspace test suite with io_uring engine
  # ---------------------------------------------------------------------------
  test-all:
    <<: *test-base
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      BOOKKEEPER_IO_ENGINE: uring
      RUST_LOG: warn
    command: >
      cargo test --workspace --
      --skip java_bookie_container
      --skip java_client

  # ---------------------------------------------------------------------------
  # Fast: only the io_uring-specific unit tests (no ZK needed)
  # ---------------------------------------------------------------------------
  test-uring-only:
    <<: *test-base
    environment:
      BOOKKEEPER_IO_ENGINE: uring
      RUST_LOG: info
    command: >
      cargo test -p bookkeeper-storage --test io_engine_test

  # ---------------------------------------------------------------------------
  # Benchmarks: io_uring vs StdEngine comparison
  # ---------------------------------------------------------------------------
  bench-uring:
    <<: *test-base
    environment:
      BOOKKEEPER_IO_ENGINE: uring
    command: >
      cargo bench -p bookkeeper-storage --bench storage_bench

  bench-std:
    <<: *test-base
    environment:
      BOOKKEEPER_IO_ENGINE: std
    command: >
      cargo bench -p bookkeeper-storage --bench storage_bench

  # ---------------------------------------------------------------------------
  # StdEngine baseline (same Linux build, forces blocking I/O)
  # ---------------------------------------------------------------------------
  test-std:
    <<: *test-base
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      BOOKKEEPER_IO_ENGINE: std
      RUST_LOG: warn
    command: >
      cargo test --workspace --
      --skip java_bookie_container
      --skip java_client
